<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ajude o Flávio a fugir</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:#0b1220;color:#fff;font-family:system-ui,sans-serif;overflow:hidden}
body{display:flex;align-items:center;justify-content:center}
canvas{height:100%;max-width:100%;aspect-ratio:480/760;touch-action:none;background:#000;display:block}
</style>
</head>
<body>
<canvas id="c" width="480" height="760"></canvas>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),W=480,H=760;
const ZONES=[{n:'ARGENTINA',c:'#5a8f3c',c2:'#7aa84f'},{n:'EQUADOR',c:'#1f7a4a',c2:'#2fa062'},{n:'FLÓRIDA',c:'#1d8fc4',c2:'#3fb1de'}];
const TOTAL=9000;
let state='menu',P,enemies,items,clouds,dist,lives,t,shield,spawnT,itemT,keys={},target=null,hit,best=0;
function reset(){P={x:W/2,y:H-140};enemies=[];items=[];dist=0;lives=3;shield=0;spawnT=0;itemT=5;hit=0;t=0;
clouds=Array.from({length:8},()=>({x:Math.random()*W,y:Math.random()*H,s:.5+Math.random()}));}
reset();
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=1;if(e.key===' '||e.key==='Enter')start();});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
function pos(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height};}
cv.addEventListener('pointerdown',e=>{start();target=pos(e);});
cv.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='touch')target=pos(e);});
addEventListener('pointerup',()=>target=null);
function start(){if(state!=='play'&&(state==='menu'||performance.now()-endAt>600)){reset();state='play';}}
let endAt=0;
function end(s){state=s;endAt=performance.now();best=Math.max(best,Math.floor(dist/TOTAL*100));}
function zone(){return Math.min(2,Math.floor(dist/TOTAL*3));}
function plane(x,y,col,dir,label){ // dir: -1 sobe, 1 desce
ctx.save();ctx.translate(x,y);if(dir>0)ctx.scale(1,-1);
ctx.fillStyle=col;
ctx.beginPath();ctx.moveTo(0,-36);ctx.lineTo(7,-10);ctx.lineTo(44,8);ctx.lineTo(44,18);ctx.lineTo(7,10);ctx.lineTo(5,28);ctx.lineTo(18,36);ctx.lineTo(18,42);ctx.lineTo(0,37);ctx.lineTo(-18,42);ctx.lineTo(-18,36);ctx.lineTo(-5,28);ctx.lineTo(-7,10);ctx.lineTo(-44,18);ctx.lineTo(-44,8);ctx.lineTo(-7,-10);ctx.closePath();ctx.fill();
ctx.strokeStyle='rgba(0,0,0,.4)';ctx.lineWidth=2;ctx.stroke();
ctx.fillStyle='rgba(180,230,255,.9)';ctx.beginPath();ctx.ellipse(0,-14,3.5,7,0,0,7);ctx.fill();
ctx.restore();
if(label){ctx.fillStyle='#fff';ctx.font='bold 9px system-ui';ctx.textAlign='center';ctx.fillText('POLÍCIA',x,y+(dir>0?-26:30)+(dir>0?0:0));ctx.fillText('FEDERAL',x,y+(dir>0?-16:40));}
}
function update(dt){
t+=dt;const sp=260+dist/TOTAL*160;dist+=sp*dt;
if(dist>=TOTAL){end('win');return;}
const v=300;let dx=0,dy=0;
if(keys.arrowleft||keys.a)dx-=1;if(keys.arrowright||keys.d)dx+=1;
if(keys.arrowup||keys.w)dy-=1;if(keys.arrowdown||keys.s)dy+=1;
P.x+=dx*v*dt;P.y+=dy*v*dt;
if(target){const tx=target.x,ty=target.y-70;P.x+=(tx-P.x)*Math.min(1,dt*10);P.y+=(ty-P.y)*Math.min(1,dt*10);}
P.x=Math.max(30,Math.min(W-30,P.x));P.y=Math.max(60,Math.min(H-50,P.y));
clouds.forEach(c=>{c.y+=sp*dt*c.s*.6;if(c.y>H+40){c.y=-40;c.x=Math.random()*W;}});
const prog=dist/TOTAL;
spawnT-=dt;if(spawnT<=0){spawnT=Math.max(.35,1.1-prog*.7);
const ch=Math.random()<.25+prog*.35;
enemies.push({x:30+Math.random()*(W-60),y:-50,vy:sp*(.35+Math.random()*.3)+120,ch});}
itemT-=dt;if(itemT<=0){itemT=9+Math.random()*5;items.push({x:40+Math.random()*(W-80),y:-30});}
enemies.forEach(e=>{e.y+=e.vy*dt;if(e.ch&&e.y<P.y-30)e.x+=Math.sign(P.x-e.x)*Math.min(Math.abs(P.x-e.x),110*dt);});
items.forEach(i=>i.y+=sp*dt*.7);
enemies=enemies.filter(e=>e.y<H+60);items=items.filter(i=>i.y<H+40);
if(shield>0)shield-=dt;if(hit>0)hit-=dt;
for(const i of items){if(Math.hypot(i.x-P.x,i.y-P.y)<34){i.y=9999;shield=5;}}
if(hit<=0&&shield<=0)for(const e of enemies){
if(Math.abs(e.x-P.x)<34&&Math.abs(e.y-P.y)<40){e.y=9999;lives--;hit=1.5;if(lives<=0)end('over');break;}}
}
function draw(){
const z=ZONES[zone()],prog=dist/TOTAL;
// fundo: terra / oceano
ctx.fillStyle=z.c;ctx.fillRect(0,0,W,H);
ctx.fillStyle=z.c2;const off=(dist*.5)%120;
for(let y=-120+off;y<H;y+=120){ctx.fillRect(0,y,W,60);}
if(zone()===2){ctx.fillStyle='rgba(255,255,255,.12)';for(let y=-60+off;y<H;y+=60){ctx.fillRect(0,y,W,3);}
const fl=Math.max(0,(prog-.88)/.12);ctx.fillStyle='#f2dfa6';ctx.fillRect(0,H-fl*H*1.2,W,fl*H*1.2);}
clouds.forEach(c=>{ctx.fillStyle='rgba(255,255,255,.55)';ctx.beginPath();ctx.ellipse(c.x,c.y,50*c.s,18*c.s,0,0,7);ctx.ellipse(c.x+25*c.s,c.y-8*c.s,30*c.s,16*c.s,0,0,7);ctx.fill();});
items.forEach(i=>{ctx.fillStyle='#ffd23f';ctx.beginPath();ctx.arc(i.x,i.y,16,0,7);ctx.fill();ctx.fillStyle='#000';ctx.font='bold 16px system-ui';ctx.textAlign='center';ctx.fillText('★',i.x,i.y+6);});
enemies.forEach(e=>plane(e.x,e.y,e.ch?'#0a2a6b':'#143c8c',1,true));
if(!(hit>0&&Math.floor(t*14)%2))plane(P.x,P.y,'#e8e8e8',-1);
if(shield>0){ctx.strokeStyle='rgba(255,210,63,'+(.5+.3*Math.sin(t*12))+')';ctx.lineWidth=4;ctx.beginPath();ctx.arc(P.x,P.y,50,0,7);ctx.stroke();}
// HUD
ctx.fillStyle='rgba(0,0,0,.45)';ctx.fillRect(0,0,W,46);
ctx.fillStyle='#fff';ctx.font='bold 14px system-ui';ctx.textAlign='left';ctx.fillText('📍 '+z.n,12,20);
ctx.textAlign='right';ctx.fillText('❤'.repeat(Math.max(0,lives)),W-12,20);
ctx.fillStyle='rgba(255,255,255,.3)';ctx.fillRect(12,30,W-24,8);
ctx.fillStyle='#ffd23f';ctx.fillRect(12,30,(W-24)*prog,8);
ctx.font='10px system-ui';ctx.textAlign='left';ctx.fillStyle='#fff';
}
function box(title,lines,col){
ctx.fillStyle='rgba(5,10,25,.82)';ctx.fillRect(0,0,W,H);
ctx.textAlign='center';ctx.fillStyle=col;ctx.font='bold 34px system-ui';
const w=title.split('\n');w.forEach((s,i)=>ctx.fillText(s,W/2,200+i*42));
ctx.fillStyle='#fff';ctx.font='16px system-ui';
lines.forEach((s,i)=>ctx.fillText(s,W/2,330+i*28));
}
function menuScreen(){
draw();
box('AJUDE O FLÁVIO\nA FUGIR',['Decole da Argentina, cruze o Equador','e chegue até a Flórida!','Fuja dos aviões da Polícia Federal.','','Setas / WASD ou arraste o dedo para pilotar','Pegue ★ para ficar protegido','','Toque ou aperte ESPAÇO para começar'],'#ffd23f');
}
let last=performance.now();
function loop(n){const dt=Math.min(.04,(n-last)/1000);last=n;
if(state==='play'){update(dt);draw();}
else if(state==='menu'){t+=dt;dist+=dt*200;if(dist>TOTAL)dist=0;clouds.forEach(c=>c.y=(c.y+dt*80)%H);menuScreen();}
else if(state==='over'){draw();box('PRESO! 🚔',['A Polícia Federal te pegou.','Progresso: '+Math.floor(dist/TOTAL*100)+'%   Recorde: '+best+'%','','Toque ou ESPAÇO para tentar de novo'],'#ff5a5a');}
else if(state==='win'){draw();box('FLÓRIDA! 🌴',['O Flávio chegou são e salvo!','Vidas restantes: '+lives,'','Toque ou ESPAÇO para jogar de novo'],'#7dff9b');}
requestAnimationFrame(loop);}
requestAnimationFrame(loop);
</script>
</body>
</html>
