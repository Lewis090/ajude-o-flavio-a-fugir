<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ajude o Flávio a fugir</title>
  <link rel="stylesheet" href="./src/styles.css?v=2">
</head>
<body>
  <main class="game-shell">
    <header class="game-header">
      <h1>✈️ Ajude o Flávio a fugir</h1>
      <p>Argentina → Equador → Estados Unidos</p>
    </header>

    <section class="game-frame" aria-label="Jogo">
      <canvas id="game-canvas" width="480" height="760"></canvas>
      <div id="game-menu" class="menu-panel">
        <p class="eyebrow">Jornada em duas fases</p>
        <h2>Escolha a dificuldade</h2>
        <p>Desvie dos aviões, pássaros e tempestades. Colete estrelas para ganhar escudo.</p>
        <div class="difficulty-list" role="group" aria-label="Nível de dificuldade">
          <button data-difficulty="easy">Fácil <small>Mais vidas e ritmo tranquilo</small></button>
          <button data-difficulty="normal" class="recommended">Normal <small>O desafio equilibrado</small></button>
          <button data-difficulty="hard">Difícil <small>Mais obstáculos e velocidade</small></button>
        </div>
        <p class="controls">Setas / WASD para pilotar · arraste no celular</p>
      </div>
      <div id="game-message" class="message-panel" hidden></div>
    </section>
  </main>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
